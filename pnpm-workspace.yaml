packages:
  - "frontend"
  - "backend"
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@reown/appkit': true
  argon2: true
  bcrypt: true
  bigint-buffer: true
  bufferutil: true
  ccxt: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  protobufjs: true
  secp256k1: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  zeromq: true

overrides:
  log-update: "^5.0.1"
  cli-spinners: "^2.9.2"
  p-queue: "^8.0.1"
  "@metamask/sdk": "0.30.0"
  "@types/react": "19.1.9"
  "@types/react-dom": "19.1.7"
  lit: "^3.3.1"
  "@lit/reactive-element": "^2.0.0"
  "@jridgewell/trace-mapping": "^0.3.20"
  react: "19.1.1"
  react-dom: "19.1.1"
  typescript: "^5.9.2"
  mysql2: "^3.14.3"
  pbkdf2: "^3.1.3"
  form-data: "^4.0.4"
  xlsx: "^0.18.5"
  nth-check: "^2.1.1"
  "@walletconnect/ethereum-provider": "2.23.1"
  "@reown/appkit": "1.8.15"
  "@reown/appkit-adapter-wagmi": "1.8.15"
  "@reown/appkit-pay": "1.8.15"
  "@reown/appkit-scaffold-ui": "1.8.15"
  "@reown/appkit-controllers": "1.8.15"
  "@reown/appkit-ui": "1.8.15"
  "@reown/appkit-utils": "1.8.15"
  "@reown/appkit-core": "1.8.15"
  "@reown/appkit-common": "1.8.15"
  "@reown/appkit-wallet": "1.8.15"
  viem: "^2.41.2"
  wagmi: "^2.19.5"
  "@wagmi/core": "2.22.1"
  "@wagmi/connectors": "5.11.2"
  "@tanstack/react-query": "^5.90.12"

peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
    - typescript
  allowedVersions:
    react: "19"
    react-dom: "19"
    typescript: "5"
    tailwindcss: "4"
    lit: "3"
