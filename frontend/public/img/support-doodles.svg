<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<!--
  The support thread's wallpaper.

  Used as a CSS mask, never as a picture: the layer under it is
  `bg-foreground/[0.05]`, so the ink is the theme's own and the pattern
  inverts with it. The reference for this was a grey-on-white PNG, and a PNG
  bakes its ink colour in — white scratches on near-black in dark, invisible
  in navy.

  Strokes are white. A mask is read as alpha by some engines and as luminance
  by others; opaque white is "show" under both.

  ── Why it is laid out the way it is ────────────────────────────────────────

  The first attempt was 27 shapes on a 220px tile at full size, and it read as
  a sparse grid of logos rather than as wallpaper: you could see the repeat,
  and each icon was big enough to be looked *at* instead of past.

  This is a jittered 9x9 grid on a 300px tile — 81 marks at roughly half the
  size. Two things make it work:

  - **A third of the marks are fillers.** Dots, dashes, commas and ticks. That
    is the reference image's real trick: the icons alone leave holes, and the
    small marks are what turn holes into texture.
  - **Cell centres sit half a cell in from each edge**, so the gap across a
    tile seam is the same 33px as the gap inside it. The repeat is seamless
    without any shape being clipped.

  Placements are generated, not hand-placed — see scratch `gen-doodles.mjs`
  in the commit that added this. Regenerating with a different seed gives a
  different scatter at the same density.
-->
